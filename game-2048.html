<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 | 小遊戲專區</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 導覽列 -->
  <header class="navbar">
    <div class="container nav-inner">
      <span class="logo">小遊戲專區</span>
      <nav>
        <a href="index.html">回首頁</a>
        <a href="family.html">家庭專區</a>
        <a href="games.html">遊戲專區</a>
        <button id="themeToggle" class="theme-toggle" title="切換深淺色主題">🌙</button>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h2>🔢 2048</h2>
      <p class="plan-note">電腦用方向鍵操作,手機直接在棋盤上滑動。相同數字合併,目標拼出 2048!</p>

      <div class="game-stats">
        <span>分數:<b id="score">0</b></span>
        <span>最高分:<b id="best">0</b></span>
        <button id="restart" class="btn-game" type="button">重新開始</button>
      </div>
      <p class="game-status" id="status"></p>

      <!-- 遊戲控制面板 -->
      <div class="game-controls-panel">
        <div class="control-group">
          <label for="themeSelect">🎨 主題：</label>
          <select id="themeSelect" class="select-game">
            <option value="classic">經典沙色</option>
            <option value="neon">霓虹幻彩</option>
            <option value="morandi">優雅莫蘭迪</option>
            <option value="forest">森林果實</option>
          </select>
        </div>
        <div class="control-group">
          <label class="toggle-switch">
            <input type="checkbox" id="aiRealtimeToggle">
            <span class="slider"></span>
            <span>💡 即時提示</span>
          </label>
          <button id="getHintBtn" class="btn-game btn-secondary" type="button">單次提示</button>
        </div>
      </div>

      <!-- AI 提示卡片 -->
      <div class="ai-hint-card" id="aiHintCard">
        <div class="hint-title">🤖 AI 智慧分析：</div>
        <div class="hint-content" id="aiHintContent">勾選「即時提示」或點擊「單次提示」以獲得最佳移動建議。</div>
      </div>

      <div class="board-2048" id="board" data-game-theme="classic"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Neil Chen. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/game-2048.js"></script>
</body>
</html>
