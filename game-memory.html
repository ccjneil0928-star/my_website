<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記憶翻牌 | 小遊戲專區</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 導覽列 -->
  <header class="navbar">
    <div class="container nav-inner">
      <span class="logo">小遊戲專區</span>
      <nav>
        <a href="index.html">回首頁</a>
        <a href="family.html">家庭專區</a>
        <a href="games.html">遊戲專區</a>
        <button id="themeToggle" class="theme-toggle" title="切換深淺色主題">🌙</button>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h2>🃏 記憶翻牌</h2>
      <p class="plan-note">翻開兩張卡片,找出相同的動物配對。全部配對完成就過關!</p>

      <div class="game-stats">
        <span>步數:<b id="moves">0</b></span>
        <span>時間:<b id="time">0</b> 秒</span>
        <span>最佳紀錄:<b id="best">—</b> 步</span>
        <button id="restart" class="btn-game" type="button">重新開始</button>
      </div>
      <p class="game-status" id="status"></p>

      <div class="memory-board" id="board"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Neil Chen. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/game-memory.js"></script>
</body>
</html>
